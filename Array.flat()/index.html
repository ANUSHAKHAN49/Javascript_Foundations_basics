<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Khata - Array.flat() Demo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --text: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .khata-card {
      background-color: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
      width: 100%;
      margin-top: 8px;
    }

    button.secondary:hover {
      background-color: #f1f5f9;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 20px 0;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
    }

    li:last-child {
      border-bottom: none;
    }

    li::before {
      content: "•";
      color: var(--accent);
      font-weight: bold;
      display: inline-block;
      width: 1em;
    }

    .empty-state {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="khata-card">
    <h2>Digital Khata</h2>
    <p class="subtitle">Array.prototype.flat() Concept Demo</p>

    <div class="input-group">
      <input type="text" id="input" placeholder="Customer name...">
      <button id="addList">Add Entry</button>
    </div>

    <button id="showList" class="secondary">Show All (Flatten Ledger)</button>

    <div class="divider"></div>

    <div id="result">
      <p class="empty-state">No entries loaded. Click "Show All" to view flattened list.</p>
    </div>
  </div>

  <!-- JavaScript file linked here -->
  <script src="script.js"></script>
</body>
</html>
