<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    .calculator {
      background-color: #333;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 280px;
    }

    #display {
      width: 100%;
      height: 50px;
      background-color: #222;
      color: #fff;
      text-align: right;
      font-size: 1.5rem;
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 45px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background-color: #e0e0e0;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #d4d4d4;
    }

    button.operator {
      background-color: #ff9500;
      color: white;
    }

    button.operator:hover {
      background-color: #e08200;
    }

    button.clear {
      background-color: #ff3b30;
      color: white;
    }

    button.clear:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" readonly>
    
    <div class="buttons">
      <button class="clear">C</button>
      <button class="operator">/</button>
      <button class="operator">*</button>
      <button class="operator">-</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">+</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>.</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">=</button>

      <button style="grid-column: span 2;">0</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
