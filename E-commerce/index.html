<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Website Practice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
        .search-box { margin-bottom: 20px; }
        input, button { padding: 8px 12px; font-size: 14px; }
        .cart-item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; background: #fff; border-radius: 5px; }
        #cart-container { margin-top: 30px; border-top: 2px solid #333; padding-top: 15px; }
        .total-bill { font-weight: bold; font-size: 18px; color: green; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>E-commerce Website</h1>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button id="searchBtn">Search</button>
    </div>

    <!-- Products Display Area -->
    <div id="main"></div>

    <!-- Cart Display Area -->
    <div id="cart-container"></div>

    <script src="script.js"></script>
</body>
</html>
