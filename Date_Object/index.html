<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time & Speed Utility App</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 450px; background: #f8f9fa; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ddd; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    input, button { padding: 8px; margin: 4px 2px 4px 0; }
    .clock { font-size: 1.8rem; font-weight: bold; color: #007bff; text-align: center; }
    .result { margin-top: 8px; font-weight: bold; color: #28a745; }
  </style>
</head>
<body>

  <!-- 1. DIGITAL CLOCK & ALARM -->
  <div class="card">
    <h2>Digital Clock & Alarm</h2>
    <div id="clockDisplay" class="clock">00:00:00</div>
    <input type="number" id="alarmHours" placeholder="Hours (0-23)" min="0" max="23">
    <input type="number" id="alarmMinutes" placeholder="Minutes (0-59)" min="0" max="59">
    <button id="setAlarmBtn">Set Alarm</button>
    <div id="alarmStatus" class="result"></div>
  </div>

  <!-- 2. EVENTS DATE CALCULATOR -->
  <div class="card">
    <h2>Events Date Calculator</h2>
    <input type="date" id="eventDateInput"><br>
    <button id="checkCountdownBtn">Check Count Down</button>
    <button id="checkPastBtn">Check Time Passed</button>
    <div id="eventResult" class="result"></div>
  </div>

  <!-- 3. TYPING SPEED MEASURER -->
  <div class="card">
    <h2>Typing Speed Measurer</h2>
    <p><i>Hello! This is the typing speed test.</i></p>
    <input type="text" id="typeInput" placeholder="Start typing here...">
    <button id="checkSpeedBtn">Check Speed</button>
    <div id="speedResult" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
